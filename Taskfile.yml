version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install dependencies
    cmds:
      - pnpm install

  update:
    desc: Update dependencies and AI rules
    cmds:
      - pnpm up --latest -r
      - pnpm ai-rulez generate

  lint:
    desc: Lint all files with poly
    cmds:
      - poly lint .

  format:
    desc: Format all files with poly
    cmds:
      - poly fmt --fix .

  typecheck:
    desc: Type-check the package
    cmds:
      - pnpm typecheck

  test:
    desc: Run tests
    cmds:
      - pnpm test

  build:
    desc: Build the package
    cmds:
      - pnpm build

  docs:build:
    desc: Build documentation
    cmds:
      - pnpm docs:build

  validate:
    desc: Run CI-equivalent validation
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: build
      - task: docs:build
