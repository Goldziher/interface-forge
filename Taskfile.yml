version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install dependencies and git hooks
    cmds:
      - pnpm install
      - task: governance:hooks

  update:
    desc: Update dependencies, pre-commit hooks, and AI rules
    cmds:
      - pnpm up --latest -r
      - poly hooks update
      - ai-rulez generate --no-local --strict-config

  lint:
    desc: Run Poly lint and format checks
    cmds:
      - poly lint .
      - poly fmt --check .

  format:
    desc: Format JavaScript, TypeScript, JSON, and CSS
    cmds:
      - poly fmt .

  typecheck:
    desc: Type-check the package
    cmds:
      - pnpm typecheck

  test:
    desc: Run tests
    cmds:
      - pnpm test

  build:
    desc: Build the package
    cmds:
      - pnpm build

  docs:build:
    desc: Build documentation
    cmds:
      - pnpm docs:build

  validate:
    desc: Run CI-equivalent validation
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: build
      - task: docs:build

  governance:hooks:
    desc: Provision pinned native governance hooks without replacing local preferences
    cmds:
      - >-
        python3 -c 'from pathlib import Path;
        p = Path("poly.local.toml");
        p.exists() or p.write_text("[hook_preferences]\nchannels = [\"system\"]\n")'
      - poly hooks update
      - poly hooks install

  governance:generate:
    desc: Generate native AI governance outputs
    cmds:
      - ai-rulez generate --no-local --strict-config

  governance:check:
    desc: Validate native AI governance and freshness
    cmds:
      - ai-rulez migrate okf --check
      - ai-rulez validate --strict --no-local
      - ai-rulez lock --check
      - ai-rulez generate --check --no-local --strict-config
