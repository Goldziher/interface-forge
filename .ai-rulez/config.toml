version = "5.0"
default_layers = ["plugins"]
name = "interface-forge"
description = "TypeScript library for creating strongly typed mock data factories using Faker.js and optional Zod schema integration"
gitignore = true

presets = ["claude", "gemini", "codex", "copilot", "cursor", "opencode", "pi"]

# ~keep agent-workflow, test-alongside-code and tdd-workflow come from xberg-core instead.
builtins = [
    "typescript",
    "testing",
    "!testing/test-alongside-code",
    "!testing/tdd-workflow",
    "!ai-governance/agent-workflow",
    "security",
    "code-quality",
    "!git-workflow",
    "default-commands",
]

[[includes]]
name = "xberg-core"
source = "https://github.com/xberg-io/agent-conventions.git"
version = "^1"
path = "modules/core"
merge_strategy = "local-override"

[[includes]]
name = "xberg-cicd"
source = "https://github.com/xberg-io/agent-conventions.git"
version = "^1"
path = "modules/cicd"
merge_strategy = "local-override"

[[mcp_servers]]
name = "ai-rulez"
description = "AI-Rulez MCP server for configuration management"
command = "pnpm"
args = ["dlx", "ai-rulez@5.3.0", "mcp"]

[defaults]
effort = "medium"

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.3.0", "mcp"]

[lock]
include_outputs = false
