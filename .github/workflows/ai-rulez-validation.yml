name: AI-Rulez validation
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # ~keep ai-rulez runs at its latest release, never a pin (org ADR-0015).
            - uses: xberg-io/actions/setup-ai-rulez@v1
            - uses: xberg-io/actions/validate-ai-rulez@v1
              with:
                  expected-config-count: '1'
