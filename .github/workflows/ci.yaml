name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    toolchain:
        name: Toolchain baseline
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Check toolchain
              uses: xberg-io/actions/check-toolchain@v1

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup mise
              uses: xberg-io/actions/setup-mise@v1
              with:
                  tools: github:Goldziher/poly actionlint

            - name: Lint
              run: mise run lint

            - name: Check formatting
              run: mise run format:check

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup mise
              uses: xberg-io/actions/setup-mise@v1
              with:
                  tools: node pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: mise run test

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup mise
              uses: xberg-io/actions/setup-mise@v1
              with:
                  tools: node pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run typecheck
              run: mise run typecheck

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup mise
              uses: xberg-io/actions/setup-mise@v1
              with:
                  tools: node pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build package
              run: mise run build

    docs:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup mise
              uses: xberg-io/actions/setup-mise@v1
              with:
                  tools: node pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build documentation
              run: mise run docs:build
