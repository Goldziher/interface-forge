# Generated by scripts/migrate_to_poly.py from .pre-commit-config.yaml + tool configs. Review before committing.

[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
    "**/*.lock",
    "**/*.min.js",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".ai-rulez/cache/**",
    ".docusaurus/**",
    "coverage/**",
    "dist/**",
    "docs/build/**",
    "node_modules/**",
]

# oxc formatter settings ported from .oxfmtrc.json (poly does not read that file).
[fmt.typescript.oxc]
indent_style = "space"
indent_width = 4
quote_style = "single"
semicolons = "always"
trailing_commas = "all"

[fmt.tsx.oxc]
indent_style = "space"
indent_width = 4
quote_style = "single"
semicolons = "always"
trailing_commas = "all"

[fmt.javascript.oxc]
indent_style = "space"
indent_width = 4
quote_style = "single"
semicolons = "always"
trailing_commas = "all"

[fmt.jsx.oxc]
indent_style = "space"
indent_width = 4
quote_style = "single"
semicolons = "always"
trailing_commas = "all"

[fmt.json.oxc]
indent_style = "space"
indent_width = 4
trailing_commas = "none"

# oxc lint uses poly's curated default rule set. The former .oxlintrc.json rule
# levels are NOT ported: poly's oxc emits its own code namespace (e.g.
# `typescript/no-explicit-any`, not the eslint-style
# `@typescript-eslint/no-explicit-any`), and oxlint categories/env/globals/plugins
# are not expressible in poly. The one override worth preserving is the
# .oxlintrc.json test/example relaxation of `no-explicit-any`, kept below in
# poly's own code format so `poly lint` stays green on fixture-heavy test code.
[per-file-ignores]
"**/*.spec.ts" = ["typescript/no-explicit-any"]
"**/*.spec.tsx" = ["typescript/no-explicit-any"]
"**/*.test.ts" = ["typescript/no-explicit-any"]
"**/*.test.tsx" = ["typescript/no-explicit-any"]
"**/tests/**" = ["typescript/no-explicit-any"]
"examples/**" = ["typescript/no-explicit-any"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
polylint = { exclude = [
    "**/*.lock",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".ai-rulez/cache/**",
    ".docusaurus/**",
    "coverage/**",
    "dist/**",
    "docs/build/**",
    "node_modules/**",
] }
polyfmt = { exclude = [
    "**/*.lock",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".ai-rulez/cache/**",
    ".docusaurus/**",
    "coverage/**",
    "dist/**",
    "docs/build/**",
    "node_modules/**",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
    "**/*.lock",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".ai-rulez/cache/**",
    ".docusaurus/**",
    "coverage/**",
    "dist/**",
    "docs/build/**",
    "node_modules/**",
] }

# --- catalog tools (standalone binaries, PATH-probed) ---
[tools.actionlint]
enabled = true

# --- lightweight inline script hooks (no toolchain) ---
[hooks.pre-commit.scripts.ai_rulez_generate]
# Regenerate CLAUDE.md/AGENTS.md and sibling agent files from .ai-rulez sources.
run = "pnpm ai-rulez generate"

# gh-actions-updater dropped: GitHub Action version bumps are handled by
# .github/dependabot.yaml, so no commit-path hook is needed.
