[defaults]
line_length = 120

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = true
fmt = true
commit = { stages = ["commit-msg"] }
# pnpm-lock.yaml is over poly's 500 KiB default. ~keep
file_safety = { max_added_file_kb = 1000 }

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate"]

[discovery]
exclude = [
    ".ai-rulez/.generated-manifest*.json",
    # toolchains.py sync writes these and its check compares them byte for byte. ~keep
    "/mise-tasks/shared.toml",
    "/mise-tasks/.shared/**",
]

[tools.actionlint]
enabled = true
