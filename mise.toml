# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
node = "26.12.1"
pnpm = "12.15.0"
"github:Goldziher/poly" = "0.31.2"
actionlint = "1.7.12"

[tasks.setup]
description = "Install the mise toolchain, dependencies and git hooks"
run = ["mise install", "pnpm install", { task = "governance:hooks:install" }]

[tasks.update]
description = "Update dependencies, hook sources and AI rules"
run = ["pnpm up --latest -r", "poly hooks update", "npx -y ai-rulez@latest generate --no-local --strict-config"]

[tasks.typecheck]
description = "Type-check the package"
run = "pnpm typecheck"

[tasks.test]
description = "Run tests"
run = "pnpm test"

[tasks.build]
description = "Build the package"
run = "pnpm build"

[tasks."docs:build"]
description = "Build documentation"
run = "pnpm docs:build"

[tasks.validate]
description = "Run CI-equivalent validation"
run = [
    { task = "lint" },
    { task = "format:check" },
    { task = "typecheck" },
    { task = "test" },
    { task = "build" },
    { task = "docs:build" },
]

[tasks."governance:generate"]
description = "Generate native AI governance outputs"
run = "npx -y ai-rulez@latest generate --no-local --strict-config"

[tasks."governance:check"]
description = "Validate native AI governance and freshness"
run = [
    "npx -y ai-rulez@latest migrate okf --check",
    "npx -y ai-rulez@latest validate --strict --no-local",
    "npx -y ai-rulez@latest lock --check",
    "npx -y ai-rulez@latest generate --check --no-local --strict-config",
]

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]
